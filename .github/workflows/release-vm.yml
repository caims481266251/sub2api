name: VM prerelease
on:
  push:
    tags: ['v*-vm.*']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: false
      - run: pnpm install --frozen-lockfile && pnpm run build
        working-directory: frontend
      - name: Build server and VM helper
        shell: bash
        run: |
          work=$(mktemp -d)
          trap 'rm -rf -- "$work"' EXIT
          export GOCACHE="$work/cache" GOTMPDIR="$work/tmp"
          mkdir -p "$GOCACHE" "$GOTMPDIR"
          bash deploy/vm-kernel/package-release.sh '${{ matrix.arch }}' release-output
      - uses: actions/upload-artifact@v7
        with:
          name: vm-linux-${{ matrix.arch }}
          path: release-output/*.tar.gz
          retention-days: 1
  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: vm-linux-*
          path: release-output
          merge-multiple: true
      - name: Publish VM prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          cd release-output
          sha256sum *.tar.gz > checksums.txt
          gh release create "$TAG" *.tar.gz checksums.txt --verify-tag --prerelease --latest=false --title "Sub2API $TAG — VM kernel preview" --notes-file ../docs/vm-kernel-release-v2.15.0-vm.1.md
